<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>异乡厨房 · 中餐家常食谱</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:"STSong","SimSun","华文宋体",Georgia,serif;overflow:hidden}

body{
  background:#1a0800;
  background-image:radial-gradient(ellipse 100% 80% at 50% 0%,#4a1800,transparent 65%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;
}

/* ═══ SCENE ═══ */
.scene{
  perspective:2200px;
  width:min(820px,96vw);
  position:relative;
}

/* ═══ BOOK SHELL ═══ */
.book-shell{
  position:relative;
  width:100%;
  /* 2:3 ratio approx */
  padding-bottom:66%;
  transform-style:preserve-3d;
  transform:rotateX(8deg);
  filter:drop-shadow(0 50px 80px rgba(0,0,0,.7)) drop-shadow(0 20px 30px rgba(0,0,0,.5));
  transition:transform .6s ease;
}
.book-shell:hover{transform:rotateX(4deg) translateY(-8px);}

/* ═══ SPINE ═══ */
.book-spine-3d{
  position:absolute;
  left:0; top:0; bottom:0; width:28px;
  background:linear-gradient(180deg,#8B2500 0%,#c0392b 30%,#96281b 60%,#7a1a06 100%);
  transform-origin:right center;
  transform:rotateY(-90deg) translateX(-14px);
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset -3px 0 8px rgba(0,0,0,.4);
  border-radius:3px 0 0 3px;
}
.spine-text{
  writing-mode:vertical-rl;font-size:.62rem;color:rgba(255,230,160,.8);
  letter-spacing:.12em;text-shadow:0 1px 3px rgba(0,0,0,.5);
}

/* ═══ BACK COVER ═══ */
.book-back-cover{
  position:absolute;inset:0;
  background:linear-gradient(135deg,#5a1a00,#8b2500,#c0392b);
  border-radius:0 6px 6px 0;
  transform:translateZ(-6px);
}

/* ═══ PAGES BLOCK (right edge) ═══ */
.pages-edge{
  position:absolute;
  right:-16px;top:3px;bottom:3px;width:16px;
  background:repeating-linear-gradient(to bottom,#f5ead0 0,#f5ead0 2px,#e8d8b8 2px,#e8d8b8 4px);
  border-radius:0 3px 3px 0;
  box-shadow:3px 0 8px rgba(0,0,0,.3);
}

/* ═══ PAGE CONTAINER ═══ */
.pages-container{
  position:absolute;inset:0;
  overflow:hidden;border-radius:0 6px 6px 0;
}

/* ═══ SINGLE PAGE (fills entire book face) ═══ */
.page{
  position:absolute;inset:0;
  display:grid;grid-template-columns:1fr 1fr;
  transform-origin:left center;
  transform-style:preserve-3d;
  opacity:0;pointer-events:none;
  transition:none;
}
.page.active{opacity:1;pointer-events:all;z-index:5;}

/* ── PAGE FLIP ANIMATION ── */
.page.flip-out{
  animation:flipOut .55s cubic-bezier(.4,0,.2,1) forwards;
  z-index:10;pointer-events:none;
}
.page.flip-in{
  animation:flipIn .55s cubic-bezier(.4,0,.2,1) forwards;
  z-index:8;pointer-events:none;
}
.page.flip-back-out{
  animation:flipBackOut .55s cubic-bezier(.4,0,.2,1) forwards;
  z-index:10;pointer-events:none;
}
.page.flip-back-in{
  animation:flipBackIn .55s cubic-bezier(.4,0,.2,1) forwards;
  z-index:8;pointer-events:none;
}
@keyframes flipOut{
  from{transform:rotateY(0deg);opacity:1;}
  to{transform:rotateY(-25deg);opacity:0;}
}
@keyframes flipIn{
  from{transform:rotateY(25deg);opacity:0;}
  to{transform:rotateY(0deg);opacity:1;}
}
@keyframes flipBackOut{
  from{transform:rotateY(0deg);opacity:1;}
  to{transform:rotateY(25deg);opacity:0;}
}
@keyframes flipBackIn{
  from{transform:rotateY(-25deg);opacity:0;}
  to{transform:rotateY(0deg);opacity:1;}
}

/* ═══ LEFT HALF (illustration) ═══ */
.page-left-half{
  background:linear-gradient(160deg,#fdf8ef 0%,#f5e8cc 100%);
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
  border-right:1px solid rgba(180,140,80,.25);
  box-shadow:inset -8px 0 20px rgba(140,80,20,.08);
}
/* Paper texture lines */
.page-left-half::before{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 27px,rgba(180,140,80,.06) 27px,rgba(180,140,80,.06) 28px);
  pointer-events:none;
}
/* Page fold shadow */
.page-left-half::after{
  content:'';position:absolute;top:0;right:0;bottom:0;width:30px;
  background:linear-gradient(to left,rgba(0,0,0,.08),transparent);
  pointer-events:none;
}

/* ═══ RIGHT HALF (text) ═══ */
.page-right-half{
  background:linear-gradient(160deg,#fdf5e8 0%,#f8edd5 100%);
  display:flex;flex-direction:column;
  padding:28px 28px 20px 24px;
  position:relative;overflow:hidden;
}
.page-right-half::before{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 27px,rgba(180,140,80,.06) 27px,rgba(180,140,80,.06) 28px);
  pointer-events:none;
}

/* ═══ COVER PAGE (special) ═══ */
.page.cover-page .page-left-half{
  background:linear-gradient(145deg,#8B2500 0%,#c0392b 40%,#96281b 100%);
}
.page.cover-page .page-right-half{
  background:linear-gradient(145deg,#7a1a06 0%,#a02508 40%,#8b1a04 100%);
  align-items:center;justify-content:center;text-align:center;
}

/* ═══ ILLUSTRATION AREA ═══ */
.illus-wrap{
  width:88%;aspect-ratio:1/1;
  position:relative;display:flex;align-items:center;justify-content:center;
  filter:drop-shadow(0 8px 20px rgba(100,40,0,.2));
}
.illus-wrap svg{width:100%;height:100%;}

/* ═══ RECIPE TEXT SIDE ═══ */
.recipe-dish-name{
  font-size:clamp(1.5rem,3.5vw,2.1rem);
  color:#7a1a06;letter-spacing:.08em;line-height:1.1;
  margin-bottom:4px;
}
.recipe-category-tag{
  display:inline-block;background:#c0392b;color:white;
  font-size:.68rem;padding:2px 10px;border-radius:12px;
  letter-spacing:.08em;margin-bottom:12px;
}
.recipe-divider{
  height:1.5px;
  background:linear-gradient(90deg,#c0392b,rgba(192,57,43,.1));
  margin-bottom:14px;
}
.recipe-meta-row{
  display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;
}
.meta-tag{
  background:rgba(192,57,43,.08);border:1px solid rgba(192,57,43,.2);
  border-radius:16px;padding:3px 10px;font-size:.72rem;color:#6b4226;
}
.section-label{
  font-size:.7rem;color:#c0392b;letter-spacing:.12em;
  font-weight:700;margin-bottom:6px;margin-top:12px;
}
.ing-chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:2px;}
.ing-chip{
  background:white;border:1px solid #e0cfb0;
  border-radius:10px;padding:2px 9px;font-size:.7rem;color:#5a3e28;
}
.steps-list{list-style:none;margin-top:4px;}
.steps-list li{
  display:flex;gap:8px;font-size:.72rem;color:#6b4226;
  line-height:1.55;margin-bottom:7px;cursor:pointer;
  padding:5px 7px;border-radius:7px;transition:background .15s;
  border:1px solid transparent;
}
.steps-list li:hover{background:rgba(192,57,43,.05);border-color:rgba(192,57,43,.12);}
.steps-list li.done{background:rgba(76,175,80,.07);border-color:rgba(76,175,80,.2);}
.step-circle{
  min-width:20px;height:20px;border-radius:50%;
  background:#c0392b;color:white;
  display:flex;align-items:center;justify-content:center;
  font-size:.62rem;font-weight:700;flex-shrink:0;margin-top:1px;
  transition:background .2s;
}
.steps-list li.done .step-circle{background:#4caf50;}
.tip-block{
  margin-top:auto;padding:8px 10px;
  background:rgba(201,147,58,.1);border-left:2.5px solid #c9933a;
  border-radius:0 6px 6px 0;font-size:.68rem;color:#6b4226;line-height:1.5;
}
.tip-label{color:#c9933a;font-weight:700;margin-right:4px;}

/* progress bar */
.prog-wrap{height:3px;background:rgba(192,57,43,.12);border-radius:2px;margin-bottom:10px;}
.prog-fill{height:100%;background:#c0392b;border-radius:2px;transition:width .4s ease;}

/* ═══ COVER CONTENT ═══ */
.cover-title-cn{
  font-size:clamp(2rem,5vw,3.2rem);
  color:#f0c060;text-shadow:0 2px 20px rgba(240,192,96,.4);
  letter-spacing:.15em;line-height:1.1;margin-bottom:8px;
}
.cover-title-sub{color:rgba(240,192,96,.7);font-size:.9rem;letter-spacing:.2em;margin-bottom:28px;}
.cover-ornament{margin:16px 0;opacity:.7;}
.cover-desc{color:rgba(255,220,160,.6);font-size:.78rem;letter-spacing:.1em;line-height:1.8;}
.cover-btn{
  margin-top:28px;padding:10px 28px;
  background:rgba(240,192,96,.18);border:1.5px solid rgba(240,192,96,.5);
  color:#f0c060;border-radius:24px;cursor:pointer;font-family:inherit;
  font-size:.88rem;letter-spacing:.1em;
  transition:all .25s;
}
.cover-btn:hover{background:rgba(240,192,96,.32);transform:translateY(-2px);}

/* Cover left illustration */
.cover-illus-bg{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;position:relative;
}
.cover-illus-bg::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 50% 50%,rgba(255,200,80,.12),transparent 70%);
}

/* ═══ NAVIGATION ═══ */
.nav-bar{
  display:flex;align-items:center;justify-content:center;gap:20px;
  margin-top:22px;position:relative;z-index:20;
}
.nav-btn{
  width:48px;height:48px;border-radius:50%;
  background:rgba(255,220,120,.12);border:1.5px solid rgba(240,192,96,.35);
  color:#f0c060;font-size:1.3rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;user-select:none;
}
.nav-btn:hover:not(:disabled){background:rgba(240,192,96,.25);transform:scale(1.1);}
.nav-btn:disabled{opacity:.25;cursor:not-allowed;}
.page-indicator{
  color:rgba(240,192,96,.6);font-size:.8rem;letter-spacing:.12em;min-width:100px;text-align:center;
}
.toc-btn{
  padding:7px 18px;border-radius:20px;
  background:rgba(255,220,120,.1);border:1.5px solid rgba(240,192,96,.3);
  color:rgba(240,192,96,.7);font-size:.78rem;cursor:pointer;font-family:inherit;
  letter-spacing:.08em;transition:all .2s;
}
.toc-btn:hover{background:rgba(240,192,96,.2);color:#f0c060;}

/* ═══ TOC OVERLAY ═══ */
.toc-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(8px);
  z-index:100;display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.toc-overlay.open{opacity:1;pointer-events:all;}
.toc-panel{
  background:linear-gradient(145deg,#fdf8ef,#f5e8cc);
  border-radius:16px;padding:28px 32px;
  width:min(500px,90vw);max-height:80vh;overflow-y:auto;
  box-shadow:0 30px 80px rgba(0,0,0,.6);
  transform:scale(.9) translateY(20px);
  transition:transform .35s cubic-bezier(.34,1.56,.64,1);
}
.toc-overlay.open .toc-panel{transform:scale(1) translateY(0);}
.toc-title{font-size:1.4rem;color:#7a1a06;letter-spacing:.08em;margin-bottom:4px;}
.toc-sub{font-size:.75rem;color:#9b6a40;margin-bottom:16px;letter-spacing:.1em;}
.toc-divider{height:1px;background:rgba(192,57,43,.2);margin-bottom:14px;}
.toc-item{
  display:flex;align-items:center;gap:12px;padding:9px 10px;
  border-radius:10px;cursor:pointer;transition:background .15s;margin-bottom:4px;
  border:1px solid transparent;
}
.toc-item:hover{background:rgba(192,57,43,.06);border-color:rgba(192,57,43,.12);}
.toc-num{
  width:28px;height:28px;border-radius:50%;background:#c0392b;
  color:white;display:flex;align-items:center;justify-content:center;
  font-size:.7rem;font-weight:700;flex-shrink:0;
}
.toc-name{font-size:.92rem;color:#2c1a0e;letter-spacing:.05em;flex:1;}
.toc-meta{font-size:.7rem;color:#9b6a40;}
.toc-close{
  position:absolute;top:16px;right:16px;
  width:30px;height:30px;border-radius:50%;background:rgba(192,57,43,.1);
  border:none;cursor:pointer;font-size:1rem;color:#7a1a06;
  display:flex;align-items:center;justify-content:center;
}

/* ═══ TOAST ═══ */
.toast{
  position:fixed;bottom:24px;left:50%;
  transform:translateX(-50%) translateY(60px);
  background:#2c1a0e;color:#f0c060;padding:9px 22px;
  border-radius:24px;font-size:.85rem;letter-spacing:.05em;
  box-shadow:0 6px 24px rgba(0,0,0,.45);z-index:300;
  pointer-events:none;transition:transform .4s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;
}
.toast.show{transform:translateX(-50%) translateY(0);}

/* Page number bottom */
.page-num-stamp{
  position:absolute;bottom:10px;font-size:.62rem;color:rgba(100,60,30,.35);letter-spacing:.1em;
}
.pn-left{left:16px;}.pn-right{right:16px;}

/* Swipe hint */
.swipe-hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  font-size:.65rem;color:rgba(192,57,43,.35);letter-spacing:.08em;pointer-events:none;}
</style>
</head>
<body>

<!-- TOC OVERLAY -->
<div class="toc-overlay" id="tocOverlay" onclick="handleTocBg(event)">
  <div class="toc-panel" style="position:relative;">
    <button class="toc-close" onclick="closeToc()">✕</button>
    <div class="toc-title">食谱目录</div>
    <div class="toc-sub">共 12 道家常菜 · 点击直接跳转</div>
    <div class="toc-divider"></div>
    <div id="tocList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="scene">
  <div class="book-shell" id="bookShell">
    <!-- Spine -->
    <div class="book-spine-3d"><span class="spine-text">异乡厨房 · 中餐家常食谱</span></div>
    <!-- Back cover -->
    <div class="book-back-cover"></div>
    <!-- Pages edge -->
    <div class="pages-edge"></div>
    <!-- Pages -->
    <div class="pages-container" id="pagesContainer"></div>
  </div>

  <div class="nav-bar">
    <button class="nav-btn" id="btnPrev" onclick="turnPage(-1)" disabled>‹</button>
    <span class="page-indicator" id="pageIndicator">封面</span>
    <button class="nav-btn" id="btnNext" onclick="turnPage(1)">›</button>
    <button class="toc-btn" onclick="openToc()">目录</button>
  </div>
</div>

<script>
/* ══════════════════════════════════════
   WATERCOLOUR-STYLE SVG ILLUSTRATIONS
   Each returns an <svg> string.
══════════════════════════════════════ */

/* Shared: Chinese blue-and-white porcelain plate */
function plateSVG(innerContent, cx=160, cy=165, r=130){
  // scalloped edge
  let scallops='';
  for(let i=0;i<24;i++){
    const a=i/24*Math.PI*2, a2=(i+.5)/24*Math.PI*2;
    const r1=r+2, r2=r-6;
    scallops+=`<circle cx="${cx+Math.cos(a)*r1}" cy="${cy+Math.sin(a)*r1}" r="11" fill="#f8f4ee"/>`;
  }
  // blue floral ring decoration
  let florals='';
  for(let i=0;i<8;i++){
    const a=i/8*Math.PI*2;
    const fx=cx+Math.cos(a)*(r-20), fy=cy+Math.sin(a)*(r-20);
    florals+=`
      <circle cx="${fx}" cy="${fy}" r="7" fill="none" stroke="#6b8fc7" stroke-width="1.2" opacity=".7"/>
      <circle cx="${fx}" cy="${fy}" r="3.5" fill="#6b8fc7" opacity=".5"/>
      <line x1="${fx+Math.cos(a-1.2)*8}" y1="${fy+Math.sin(a-1.2)*8}" x2="${fx+Math.cos(a-1.2)*14}" y2="${fy+Math.sin(a-1.2)*14}" stroke="#6b8fc7" stroke-width="1" opacity=".5"/>
      <line x1="${fx+Math.cos(a+1.2)*8}" y1="${fy+Math.sin(a+1.2)*8}" x2="${fx+Math.cos(a+1.2)*14}" y2="${fy+Math.sin(a+1.2)*14}" stroke="#6b8fc7" stroke-width="1" opacity=".5"/>
      <ellipse cx="${fx+Math.cos(a-1.2)*16}" cy="${fy+Math.sin(a-1.2)*16}" rx="3" ry="2" fill="#8aadd8" opacity=".45" transform="rotate(${a*180/Math.PI-70} ${fx+Math.cos(a-1.2)*16} ${fy+Math.sin(a-1.2)*16})"/>
      <ellipse cx="${fx+Math.cos(a+1.2)*16}" cy="${fy+Math.sin(a+1.2)*16}" rx="3" ry="2" fill="#8aadd8" opacity=".45" transform="rotate(${a*180/Math.PI+70} ${fx+Math.cos(a+1.2)*16} ${fy+Math.sin(a+1.2)*16})"/>`;
  }
  // vine lines between florals
  let vines='';
  for(let i=0;i<8;i++){
    const a1=(i+.1)/8*Math.PI*2, a2=(i+.9)/8*Math.PI*2;
    const r0=r-18;
    vines+=`<path d="M${cx+Math.cos(a1)*r0} ${cy+Math.sin(a1)*r0} Q${cx+Math.cos((a1+a2)/2)*(r0-8)} ${cy+Math.sin((a1+a2)/2)*(r0-8)} ${cx+Math.cos(a2)*r0} ${cy+Math.sin(a2)*r0}" fill="none" stroke="#6b8fc7" stroke-width=".9" opacity=".45"/>`;
  }
  return`<svg viewBox="0 0 320 330" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="plateGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fffef9"/>
      <stop offset="100%" stop-color="#f0ead8"/>
    </radialGradient>
    <filter id="wc" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="wc2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.4" numOctaves="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <clipPath id="plateClip"><circle cx="${cx}" cy="${cy}" r="${r-24}"/></clipPath>
  </defs>
  <!-- scalloped back -->
  ${scallops}
  <!-- plate base -->
  <circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#plateGrad)" filter="url(#wc)"/>
  <!-- rim ring -->
  <circle cx="${cx}" cy="${cy}" r="${r-6}" fill="none" stroke="#b8cce4" stroke-width="2" opacity=".6"/>
  <circle cx="${cx}" cy="${cy}" r="${r-10}" fill="none" stroke="#8aadd8" stroke-width=".8" opacity=".4"/>
  <!-- florals -->
  ${florals}
  ${vines}
  <!-- inner plate surface -->
  <circle cx="${cx}" cy="${cy}" r="${r-24}" fill="#fffdf5" opacity=".5"/>
  <!-- food content -->
  <g clip-path="url(#plateClip)" filter="url(#wc2)">${innerContent}</g>
  <!-- shine -->
  <ellipse cx="${cx-28}" cy="${cy-30}" rx="22" ry="12" fill="white" opacity=".18" transform="rotate(-30 ${cx-28} ${cy-30})"/>
</svg>`;
}

/* ── 番茄炒鸡蛋 ── */
function svgTomato(){
  return plateSVG(`
    <!-- sauce base -->
    <ellipse cx="160" cy="168" rx="105" ry="85" fill="#e85520" opacity=".75"/>
    <ellipse cx="155" cy="162" rx="85" ry="68" fill="#f06030" opacity=".6"/>
    <!-- tomato wedges -->
    <path d="M120 140 Q105 125 125 118 Q148 112 158 130 Q168 148 148 155 Z" fill="#e53e1e" opacity=".9"/>
    <path d="M182 150 Q195 138 205 148 Q212 162 198 170 Q184 176 178 162 Z" fill="#d93319" opacity=".88"/>
    <path d="M130 180 Q118 170 122 158 Q128 144 142 148 Q155 154 152 168 Q148 182 134 182 Z" fill="#e84520" opacity=".85"/>
    <path d="M165 185 Q178 180 185 190 Q188 202 176 206 Q162 208 158 196 Z" fill="#d63015" opacity=".82"/>
    <path d="M105 160 Q96 150 102 140 Q110 128 122 134 Q130 142 124 155 Z" fill="#e03a1a" opacity=".78"/>
    <!-- tomato seeds -->
    <ellipse cx="134" cy="134" rx="3" ry="4" fill="#f9a825" opacity=".8"/>
    <ellipse cx="145" cy="130" rx="2" ry="3" fill="#f9a825" opacity=".7"/>
    <ellipse cx="192" cy="156" rx="3" ry="4" fill="#f9a825" opacity=".75"/>
    <ellipse cx="174" cy="196" rx="2" ry="3" fill="#f9a825" opacity=".7"/>
    <!-- egg blobs -->
    <path d="M145 145 Q158 136 170 145 Q182 156 174 168 Q164 178 150 170 Q138 160 145 145Z" fill="#f9e040" opacity=".88"/>
    <path d="M168 155 Q182 148 192 158 Q198 170 188 178 Q176 184 168 174 Q160 164 168 155Z" fill="#f5d820" opacity=".85"/>
    <path d="M120 165 Q132 158 142 168 Q148 180 138 186 Q126 190 118 180 Q112 170 120 165Z" fill="#fce838" opacity=".82"/>
    <path d="M148 180 Q158 174 165 183 Q168 194 158 198 Q146 200 142 190 Q140 182 148 180Z" fill="#f9df30" opacity=".78"/>
    <path d="M105 148 Q114 140 122 148 Q128 158 120 165 Q110 170 105 160 Q100 152 105 148Z" fill="#fbe835" opacity=".75"/>
    <!-- scallion garnish -->

      <div class="section-label">🛒 食材</div>
      <div class="ing-chips">${recipe.ingredients.map(i=>`<span class="ing-chip">${i}</span>`).join('')}</div>
      <div class="section-label">👨‍🍳 步骤</div>
      <div class="prog-wrap"><div class="prog-fill" id="prog-${pageIdx}" style="width:0%"></div></div>
      <ul class="steps-list" id="${stepId}">${recipe.steps.map((s,i)=>`
        <li onclick="toggleStep(${pageIdx},${i})">
          <span class="step-circle">${i+1}</span>
          <span>${s}</span>
        </li>`).join('')}</ul>
      <div class="tip-block"><span class="tip-label">💡 小贴士</span>${recipe.tip}</div>
      <span class="page-num-stamp pn-right">${pageIdx * 2}</span>
    </div>`;
  return div;
}

/* ── Init pages ── */
const container = document.getElementById('pagesContainer');
container.appendChild(buildCoverPage());
RECIPES.forEach((r,i)=>container.appendChild(buildRecipePage(r,i+1)));

/* ── TOC ── */
const tocList = document.getElementById('tocList');
RECIPES.forEach((r,i)=>{
  const el = document.createElement('div');
  el.className='toc-item';
  el.innerHTML=`<div class="toc-num">${i+1}</div><div class="toc-name">${r.name}</div><div class="toc-meta">${r.cat} · ${r.time}</div>`;
  el.onclick=()=>{goToPage(i+1);closeToc();};
  tocList.appendChild(el);
});

/* ══════════════════════════════════════
   STEP TRACKING
══════════════════════════════════════ */
const stepsDone = {};
function toggleStep(pageIdx, stepIdx){
  if(!stepsDone[pageIdx]) stepsDone[pageIdx]=new Array(RECIPES[pageIdx-1].steps.length).fill(false);
  stepsDone[pageIdx][stepIdx]=!stepsDone[pageIdx][stepIdx];
  const ul=document.getElementById(`steps-${pageIdx}`);
  if(!ul)return;
  ul.querySelectorAll('li')[stepIdx].classList.toggle('done',stepsDone[pageIdx][stepIdx]);
  ul.querySelectorAll('li')[stepIdx].querySelector('.step-circle').textContent=stepsDone[pageIdx][stepIdx]?'✓':(stepIdx+1);
  const done=stepsDone[pageIdx].filter(Boolean).length, total=stepsDone[pageIdx].length;
  const bar=document.getElementById(`prog-${pageIdx}`);
  if(bar) bar.style.width=`${done/total*100}%`;
  if(done===total) showToast('🎉 '+RECIPES[pageIdx-1].name+' 大功告成！');
  else showToast(`已完成 ${done}/${total} 步`);
}

/* ══════════════════════════════════════
   PAGE TURNING
══════════════════════════════════════ */
function turnPage(dir){
  const next=currentPage+dir;
  if(next<0||next>=totalPages) return;
  goToPage(next,dir);
}

function goToPage(target, dir=1){
  if(target===currentPage) return;
  const pages=container.querySelectorAll('.page');
  const curEl=pages[currentPage], nextEl=pages[target];
  dir = target > currentPage ? 1 : -1;

  curEl.classList.remove('active');
  curEl.classList.add(dir>0?'flip-out':'flip-back-out');
  nextEl.style.opacity='0';
  nextEl.classList.add(dir>0?'flip-in':'flip-back-in');

  setTimeout(()=>{
    curEl.classList.remove('flip-out','flip-back-out');
    nextEl.classList.remove('flip-in','flip-back-in');
    nextEl.classList.add('active');
    nextEl.style.opacity='';
    currentPage=target;
    updateNav();
  },550);
}

function updateNav(){
  document.getElementById('btnPrev').disabled=currentPage===0;
  document.getElementById('btnNext').disabled=currentPage===totalPages-1;
  document.getElementById('pageIndicator').textContent=
    currentPage===0?'封面':`第 ${currentPage} / ${RECIPES.length} 道`;
}

/* ═══ TOC ═══ */
function openToc(){document.getElementById('tocOverlay').classList.add('open');}
function closeToc(){document.getElementById('tocOverlay').classList.remove('open');}
function handleTocBg(e){if(e.target===document.getElementById('tocOverlay'))closeToc();}

/* ═══ TOAST ═══ */
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600);
}

/* ═══ KEYBOARD ═══ */
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown') turnPage(1);
  if(e.key==='ArrowLeft'||e.key==='ArrowUp') turnPage(-1);
});

/* ═══ TOUCH SWIPE ═══ */
let tx=0;
document.getElementById('bookShell').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
document.getElementById('bookShell').addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>40) turnPage(dx<0?1:-1);
},{passive:true});

updateNav();
</script>
</body>
</html>
